    <style>
/* 卡片个性化样式，仅写在本html内，不修改card.css */
body {
  --accent: #39785b;
  font-family: "Segoe UI", system-ui, sans-serif;
}

.eyebrow {
  letter-spacing: 0.12em;
  opacity: 0.75;
  font-weight: 500;
}

h2 {
  font-weight: 600;
  color: var(--accent);
  margin: 8px 0;
  /* 新增淡入动画 */
  animation: fadeIn 1s ease;
}

/* 定义动画 */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
/* 横向作品画廊 */
.gallery {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 8px 0;
  margin-top:16px;
}
.gallery-item {
  flex: 0 0 140px;
  text-align: center;
  animation: fadeIn 1s ease 1.2s both;
}
.gallery-item img {
  width:100%;
  border-radius:12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: transform 0.25s ease;
}
.gallery-item img:hover {
  transform: scale(1.04);
}
.gallery-item p {
  margin:6px 0 0;
  font-size:14px;
  color:#444;
}


.class-name {
  opacity: 0.7;
  font-size: 0.95rem;
}

.intro {
  line-height: 1.75;
  margin: 16px 0;
  color: #2c2c2c;
}

/* 技能标签样式 + 悬浮动画 */
.tags {
  display: flex;
  gap: 10px;
  list-style: none;
  padding: 0;
  flex-wrap: wrap;
  margin: 18px 0;
}
.tags li {
  background-color: #f0f7f3;
  color: #39785b;
  border: 1px solid #39785b40;
  padding: 4px 12px;
  border-radius: 999px;
  transition: all 0.25s ease;
}
.tags li:hover {
  background-color: #39785b;
  color: white;
  transform: translateY(-2px);
}

.goal {
  line-height: 1.7;
  margin-top: 12px;
  color: #333;
}
.goal strong {
  color: var(--accent);
}
</style>
</head>

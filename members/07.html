
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>叶斌铖 · 自我介绍</title>
  <link rel="stylesheet" href="card.css">
  <style>
  body {
    font-family: 'Microsoft YaHei', sans-serif;
    background: #f0f4f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    --accent: #39785b;
    padding: 20px; 
  }

  /* 竖版卡片容器 */
  .card {
    background: #fff;
    border-radius: 20px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    padding: 50px 35px; 
    max-width: 320px; 
    width: 100%;
    text-align: center;
    animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
  }

  /* 卡片整体入场动画 */
  @keyframes floatUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 内容依次淡入 */
  .eyebrow, h2, .class-name, .intro, .tags, .goal-box {
    opacity: 0;
    animation: fadeIn 0.8s ease forwards;
  }

  .eyebrow {
    animation-delay: 0.3s;
    color: var(--accent);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
  }

  h2 {
    animation-delay: 0.4s;
    color: #2c3e50;
    margin: 0 0 8px 0;
    font-size: 32px; 
  }

  .class-name {
    animation-delay: 0.5s;
    color: var(--accent);
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 30px; 
    display: inline-block;
    background: #e8f5e9;
    padding: 4px 16px;
    border-radius: 20px;
  }

  .intro {
    animation-delay: 0.6s;
    color: #555;
    line-height: 2; 
    margin: 0 0 35px 0;
    font-size: 15px;
    padding: 0 10px; 
  }

  /* 标签竖排布局 */
  .tags {
    animation-delay: 0.7s;
    list-style: none;
    padding: 0;
    display: flex;
    flex-direction: column; 
    gap: 12px;
    margin-bottom: 35px;
  }

  .tags li {
    background: #f4f9f5;
    color: var(--accent);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid #dcedc8;
    transition: all 0.3s ease;
    cursor: default;
  }

  .tags li:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: scale(1.05);
  }

  /* 目标框 */
  .goal-box {
    animation-delay: 0.8s;
    background: #f9fbf9;
    border-left: 4px solid var(--accent);
    padding: 20px;
    border-radius: 0 12px 12px 0;
    text-align: left;
    color: #444;
    font-size: 13px;
    line-height: 1.8;
  }

  .goal-box strong {
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* 基础淡入动画 */
  @keyframes fadeIn { 
    to { opacity: 1; } 
  }
</style>
</head>
<body style="--accent: #39785b">
  <p class="eyebrow">ABOUT ME / 07</p>
  <h2>叶斌铖</h2>
  <p class="class-name">智能2602</p>
  <!-- TODO：完成下面的介绍、三个技能或兴趣标签，以及学习目标。 -->
  <p class="intro">我是孜孜不倦的学习者，在知识的旅途中不断蜕变。</p>
  <ul class="tags" aria-label="我的技能和兴趣">
    <li>python</li><li>机器学习</li><li>深度探索</li>
  </ul>
  <p class="goal"><strong>我想学会</strong>在绿荫的指导下，逐步学习Python编程和机器学习算法。</p>
</body>
</html>

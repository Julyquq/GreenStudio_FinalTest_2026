<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>吴柏鑫 · 自我介绍</title>
  <link rel="stylesheet" href="card.css">
  <style>
/* ===== 原有样式（保持不变） ===== */
.intro {
  font-family: ui-monospace, Consolas, monospace;
  color: var(--accent);
  background: #eaf3de;
  border-left: 3px solid #ba7517;
  padding: 10px 12px;
  border-radius: 6px;
  min-height: 3.5em;
}
.caret {
  display: inline-block;
  width: 7px; height: 1em;
  background: var(--accent);
  vertical-align: -2px;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }
.tags li { transition: transform .2s, background .2s; }
.tags li:hover { transform: translateY(-3px); background: var(--accent); color: #fff; }

/* ===== 一、校徽 ===== */
.badge {
  height: 1.2em;            /* 跟随字号，和标签文字等高 */
  width: auto;
  display: block;
  flex: 0 0 auto;
  background: #fff;         /* 校徽内部镂空，垫白底，hover 变蓝才看得见 */
  border-radius: 3px;
  padding: 1px;
}

/* ===== 标签外层：为翻转和草环做准备 ===== */
.tags { gap: 12px; }                       /* 留出空隙给环绕的小草 */
.tags li {
  position: relative;                       /* 小草环定位基准 */
  display: inline-flex; align-items: center; gap: 5px;
  perspective: 700px;                       /* 360° 翻转的立体感 */
}

/* ===== 二、红色小爱心 ===== */
.heart {
  width: 1em; height: 1em;
  position: relative;
  display: inline-block;
  animation: heartbeat 1.2s ease-in-out infinite;
}
.heart::before, .heart::after {
  content: "";
  position: absolute;
  top: 0; left: .5em;
  width: .5em; height: .8em;
  background: #e0245e;
  border-radius: .5em .5em 0 0;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
}
.heart::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  25%      { transform: scale(1.3); }
  40%      { transform: scale(1); }
}

/* ===== 三、绿荫工作室：环绕一圈摇摆的小草 ===== */
.tag-grass .grass-ring { position: absolute; inset: 0; pointer-events: none; }
.tag-grass .grass-ring i { position: absolute; width: 0; height: 0; transform: rotate(var(--rot)); }
.tag-grass .grass-ring i::before {
  content: "";
  position: absolute;
  left: -1px; bottom: -1px;
  width: 2px; height: var(--h, 7px);
  background: linear-gradient(to top, #2e7d32, #7cc47f);
  border-radius: 2px 2px 0 0;
  transform-origin: 50% 100%;
  animation: sway 1.8s ease-in-out infinite;
  animation-delay: var(--delay, 0s);
}
@keyframes sway { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }

/* ===== 四、360° 翻转：每 5 秒转一整圈 ===== */
.flip {
  display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap;
  transform-style: preserve-3d;
  animation: spinFlip 5s infinite ease-in-out;
}
@keyframes spinFlip {
  0%, 84% { transform: rotateY(0deg); }      /* 前 4.2 秒静止 */
  100%    { transform: rotateY(360deg); }    /* 最后 0.8 秒转满一圈 */
}
.tags li:hover .flip { animation-play-state: paused; }

/* ===== 五、奔跑的小人：前倾 + 有膝盖 ===== */
.runner { display: inline-block; vertical-align: -8px; margin-left: 4px; }
.runner svg {
  display: block; overflow: visible;
  stroke: var(--accent); fill: none;
  stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
}
.runner .head { fill: var(--accent); stroke: none; }

/* 前倾：绕脚踝 (30,44) 转 10°，头向前探、脚留在原地 */
.runner .body {
  transform-box: view-box;
  transform-origin: 30px 44px;
  animation: bob .6s ease-in-out infinite;
}
/* 关节：父 g 绕髋/肩转，内部 g 绕膝/肘转，嵌套后膝盖自动跟随 */
.runner .arm, .runner .fore, .runner .leg, .runner .shin { transform-box: view-box; }
.runner .arm  { transform-origin: 30px 18px; animation: armSwing .6s ease-in-out infinite; }
.runner .fore { transform-origin: 30px 24px; animation: elbow    .6s ease-in-out infinite; }
.runner .leg  { transform-origin: 30px 30px; animation: legSwing .6s ease-in-out infinite; }
.runner .shin { transform-origin: 30px 37px; animation: knee     .6s ease-in-out infinite; }
/* 负延迟 = 从中途开始播，左右肢体正好反相 */
.runner .arm-r, .runner .fore-r, .runner .leg-l, .runner .shin-l { animation-delay: -.3s; }
/* 后侧肢体画淡，做出前后层次 */
.runner .arm-r, .runner .fore-r, .runner .leg-r, .runner .shin-r { opacity: .45; }

.runner .speed line { animation: dash .6s linear infinite; }
.runner .speed line:nth-child(2) { animation-delay: .3s; }

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(10deg); }
  50%      { transform: translateY(-2.5px) rotate(10deg); }
}
@keyframes armSwing { 0%,100% { transform: rotate(-40deg); } 50% { transform: rotate(35deg); } }
@keyframes elbow    { 0%,100% { transform: rotate(-75deg); } 50% { transform: rotate(-95deg); } }
@keyframes legSwing { 0%,100% { transform: rotate(-38deg); } 50% { transform: rotate(28deg); } }
@keyframes knee {
  0%   { transform: rotate(10deg); }
  20%  { transform: rotate(4deg); }
  50%  { transform: rotate(42deg); }
  75%  { transform: rotate(88deg); }
  100% { transform: rotate(10deg); }
}
@keyframes dash {
  0%   { transform: translateX(12px); opacity: 0; }
  25%  { opacity: 1; }
  100% { transform: translateX(-14px); opacity: 0; }
}
  </style>
</head>
<body style="--accent: #185fa5">
  <p class="eyebrow">ABOUT ME / 03</p>
  <h2>吴柏鑫</h2>
  <p class="class-name">电子2603</p>
  <!-- TODO：完成下面的介绍、三个技能或兴趣标签，以及学习目标。 -->
  <p class="intro"><span id="typed"></span><span class="caret"></span></p>

  <ul class="tags" aria-label="我的技能和兴趣">
    <li><span class="flip">南工大<img class="badge" src="njtech-logo.png" alt="南京工业大学校徽"></span></li>
    <li class="tag-grass"><span class="flip">绿荫工作室</span></li>
    <li><span class="flip">申铭清<span class="heart" aria-hidden="true"></span></span></li>
  </ul>

  <p class="goal"><strong>我想学会</strong>不断进步，超越昨天的自己。<span class="runner" aria-hidden="true"><svg viewBox="0 0 52 48" width="34" height="32"><g class="speed"><line x1="2" y1="19" x2="12" y2="19"/><line x1="0" y1="29" x2="9" y2="29"/></g><g class="body"><circle class="head" cx="30" cy="9" r="5"/><path d="M30 14 L30 30"/><g class="arm arm-r"><path d="M30 18 L30 24"/><g class="fore fore-r"><path d="M30 24 L30 29"/></g></g><g class="leg leg-r"><path d="M30 30 L30 37"/><g class="shin shin-r"><path d="M30 37 L30 44"/></g></g><g class="arm arm-l"><path d="M30 18 L30 24"/><g class="fore fore-l"><path d="M30 24 L30 29"/></g></g><g class="leg leg-l"><path d="M30 30 L30 37"/><g class="shin shin-l"><path d="M30 37 L30 44"/></g></g></g></svg></span></p>

<script>
const text = '我是吴柏鑫。以好奇为灯，以坚持为路，慢慢长成自己喜欢的样子。';
const el = document.getElementById('typed');
let i = 0, deleting = false;

function loop() {
  el.textContent = text.slice(0, i);
  if (!deleting) {
    i++;
    if (i > text.length) { deleting = true; setTimeout(loop, 1000); return; }
    setTimeout(loop, 60);
  } else {
    i--;
    if (i < 0) { deleting = false; i = 0; setTimeout(loop, 700); return; }
    setTimeout(loop, 30);
  }
}
loop();

/* ===== 三、给「绿荫工作室」长一圈小草 ===== */
(function () {
  const tag = document.querySelector('.tag-grass');
  if (!tag) return;
  const ring = document.createElement('span');
  ring.className = 'grass-ring';
  ring.setAttribute('aria-hidden', 'true');

  const N = 14;                                  /* 草的数量 */
  const w = tag.offsetWidth, h = tag.offsetHeight;
  const rx = w / 2 + 5, ry = h / 2 + 4;          /* 椭圆环半径，决定离标签远近 */
  for (let k = 0; k < N; k++) {
    const a = k / N * Math.PI * 2;
    const x = w / 2 + rx * Math.cos(a);
    const y = h / 2 + ry * Math.sin(a);
    const deg = Math.atan2(ry * Math.sin(a), rx * Math.cos(a)) * 180 / Math.PI + 90;
    const blade = document.createElement('i');
    blade.style.left = x + 'px';
    blade.style.top = y + 'px';
    blade.style.setProperty('--rot', deg + 'deg');
    blade.style.setProperty('--h', (6 + (k % 3) * 2) + 'px');
    blade.style.setProperty('--delay', (k * 0.12) + 's');
    ring.appendChild(blade);
  }
  tag.appendChild(ring);
})();
</script>
</body>
</html>
